onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'

overrides:
  cookie: '^1.0.2'
  # Security floors for transitive deps the direct ranges do not reach
  # (pnpm audit, 2026-11-05): devalue via svelte, postcss/nanoid via the
  # shadcn-svelte CLI, source-map-js via @tailwindcss/node.
  devalue: '^5.9.3'
  postcss: '^8.5.23'
  nanoid: '^3.3.18'
  source-map-js: '^1.2.2'
