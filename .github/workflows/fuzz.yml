name: Fuzz

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: "Per-target fuzz duration in seconds"
        required: false
        default: "120"

permissions: read-all

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_boundary_config
          - parse_security_config
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master @ 2026-10-16
        with:
          toolchain: nightly

      - name: Cache cargo and fuzz artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "fuzz -> target"
          shared-key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "^0.12"

      - name: Run fuzz target
        run: |
          DURATION="${{ github.event.inputs.duration || '120' }}"
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="${DURATION}" \
            -rss_limit_mb=2048 \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
