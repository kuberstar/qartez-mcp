name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.7.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.xz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.xz
          # Linux gnu binaries link against the builder's glibc and need at
          # least that version at runtime, so build on the oldest supported
          # Ubuntu (22.04, glibc 2.35). `ubuntu-latest` produced binaries
          # requiring GLIBC_2.39 that did not start on 22.04 (issue #50).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.xz
            max_glibc: "2.35"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.xz
            max_glibc: "2.35"
          # musl targets disabled: libgit2-sys/libssh2-sys pull openssl-sys,
          # which cannot find OpenSSL on the default musl builder. Users on
          # Alpine/musl hit install.sh's source-build fallback automatically.
          # TODO: enable by disabling git2 default features or using vendored
          # openssl, then add back to the matrix.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master @ 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Ensure Rust target installed
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Cache cargo registry / git / target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux musl targets)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # Node + pnpm are required so the qartez-dashboard build script can
      # compile the SvelteKit bundle that is rust-embedded into the binary.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js (for dashboard frontend build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected tag format '$ref' - expected vX.Y.Z"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          CARGO_PROFILE_RELEASE_LTO: "thin"
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" --bins

      - name: Verify glibc floor (Linux gnu targets)
        if: matrix.max_glibc
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          set -euo pipefail
          for bin in qartez qartez-guard qartez-setup; do
            file="target/$TARGET/release/$bin"
            # objdump failing must fail the step, not read as "no symbols".
            syms=$(objdump -T "$file")
            need=$(grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' <<<"$syms" | sed 's/^GLIBC_//' | sort -uV | tail -n1 || true)
            if [ -z "$need" ]; then
              echo "::error::$bin: no GLIBC symbol versions found, cannot verify the glibc floor"
              exit 1
            fi
            top=$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -n1)
            if [ "$top" != "$MAX_GLIBC" ]; then
              echo "::error::$bin requires GLIBC_$need, above the supported floor GLIBC_$MAX_GLIBC"
              exit 1
            fi
            echo "$bin requires at most GLIBC_$need (floor GLIBC_$MAX_GLIBC)"
          done

      - name: Stage archive contents
        id: stage
        shell: bash
        run: |
          set -eu
          stem="qartez-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          staging="staging/$stem"
          mkdir -p "$staging"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/qartez.exe" "$staging/"
              cp "target/${{ matrix.target }}/release/qartez-guard.exe" "$staging/"
              cp "target/${{ matrix.target }}/release/qartez-setup.exe" "$staging/"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/qartez" "$staging/"
              cp "target/${{ matrix.target }}/release/qartez-guard" "$staging/"
              cp "target/${{ matrix.target }}/release/qartez-setup" "$staging/"
              ;;
          esac
          cp LICENSE "$staging/"
          cp README.md "$staging/"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"

      - name: Package archive (tar.xz)
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          tar -C staging -cJf "dist/${{ steps.stage.outputs.stem }}.tar.xz" "${{ steps.stage.outputs.stem }}"

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "staging/${{ steps.stage.outputs.stem }}" -DestinationPath "dist/${{ steps.stage.outputs.stem }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.stage.outputs.stem }}
          path: dist/${{ steps.stage.outputs.stem }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Generate SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Resolve version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          shopt -s nullglob
          files=(qartez-*.tar.xz qartez-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release archives found under dist/"
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    name: SLSA build provenance
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/qartez-*.tar.xz
            dist/qartez-*.zip
            dist/SHA256SUMS

  release:
    name: Attach assets to GitHub Release
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lah dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ needs.checksums.outputs.tag }}
          files: |
            dist/qartez-*.tar.xz
            dist/qartez-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          append_body: false
          draft: false
          prerelease: false
